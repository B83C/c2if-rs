[package]
name = "c2if-rp2040-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
c2if = { path = "../..", features = ["embassy", "cortex-m", "bridge"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.9", features = ["rp2040", "boot2-w25q080", "time-driver", "critical-section-impl", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
cortex-m = { version = "0.7", default-features = false }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
embedded-hal = "1.0"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
opt-level = "s"
lto = true
